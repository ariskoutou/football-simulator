<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Live AI Football Simulator & Monte Carlo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #94a3b8; font-size: 13px; }
    input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .status-box { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; line-height: 1.5; }
    .status-success { background: #064e3b; border: 1px solid #059669; color: #a7f3d0; }
    .status-error { background: #450a0a; border: 1px solid #dc2626; color: #fecaca; }
    .results { margin-top: 24px; display: none; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: #0f172a; padding: 16px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
    .stat-card h3 { margin: 0 0 8px 0; font-size: 14px; color: #94a3b8; }
    .stat-card p { margin: 0; font-size: 22px; font-weight: bold; color: #38bdf8; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #0f172a; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
    th { background: #1e293b; color: #94a3b8; }
    .badge-value { background: #166534; color: #4ade80; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚽ Live AI Football Simulator</h1>

  <div class="grid">
    <div>
      <label>Γηπεδούχος Ομάδα (Home)</label>
      <input type="text" id="homeTeam" placeholder="π.χ. Inter, Real Madrid, Arsenal" value="Inter">
    </div>
    <div>
      <label>Φιλοξενούμενη Ομάδα (Away)</label>
      <input type="text" id="awayTeam" placeholder="π.χ. Juventus, Barcelona, Chelsea" value="Juventus">
    </div>
  </div>

  <div class="grid">
    <div>
      <label>Ημερομηνία Αγώνα</label>
      <input type="date" id="matchDate">
    </div>
    <div>
      <label>Αριθμός Προσομοιώσεων</label>
      <select id="simRuns">
        <option value="50000">50.000 Αγώνες (Προτεινόμενο)</option>
        <option value="100000">100.000 Αγώνες</option>
      </select>
    </div>
  </div>

  <button onclick="startProcess()">🚀 Ανάκτηση Πραγματικών Στατιστικών & Προσομοίωση</button>
  
  <div id="statusBox" class="status-box"></div>

  <div id="resultsPanel" class="results">
    <h2>📊 Πραγματικά Στατιστικά & Monte Carlo</h2>
    <div class="card-grid">
      <div class="stat-card">
        <h3>Μ.Ο. Σουτ Αγώνα</h3>
        <p id="totalShotsAvg">-</p>
      </div>
      <div class="stat-card">
        <h3>Σουτ στον Στόχο (SoT)</h3>
        <p id="totalSotAvg">-</p>
      </div>
      <div class="stat-card">
        <h3>Αναμενόμενα Κόρνερ</h3>
        <p id="totalCornersAvg">-</p>
      </div>
    </div>

    <h3>Πιθανότητες & Αξία (Value Check)</h3>
    <table>
      <thead>
        <tr>
          <th>Αγορά</th>
          <th>Πιθανότητα %</th>
          <th>Δίκαιη Απόδοση</th>
          <th>Μπουκ (Ενδ.)</th>
          <th>Έλεγχος Value</th>
        </tr>
      </thead>
      <tbody id="marketTable"></tbody>
    </table>

    <div style="margin-top: 24px;">
      <canvas id="shotsChart" height="120"></canvas>
    </div>
  </div>
</div>

<script>
  const API_KEY = "a3f94363edd99e91499871d7e67380a0";

  document.getElementById('matchDate').valueAsDate = new Date();

  function getPoisson(lambda) {
    let L = Math.exp(-lambda), k = 0, p = 1;
    do { k++; p *= Math.random(); } while (p > L);
    return k - 1;
  }

  let chartInstance = null;

  async function fetchRealTeamStats(teamName, isHome, key) {
    if (!key) return null;

    try {
      // 1. Εύρεση ομάδας
      let searchRes = await fetch(`https://v3.football.api-sports.io/teams?search=${encodeURIComponent(teamName)}`, {
        headers: { "x-apisports-key": key }
      });
      let searchData = await searchRes.json();
      if (!searchData.response || searchData.response.length === 0) {
        return { error: `Η ομάδα "${teamName}" δεν βρέθηκε! Έλεγξε την ορθογραφία.` };
      }

      let team = searchData.response[0].team;

      // 2. Εντοπισμός πρωταθλήματος
      let leaguesRes = await fetch(`https://v3.football.api-sports.io/leagues?team=${team.id}&current=true`, {
        headers: { "x-apisports-key": key }
      });
      let leaguesData = await leaguesRes.json();
      
      let primaryLeague = leaguesData.response.find(l => l.league.type === "League") || leaguesData.response[0];
      let leagueId = primaryLeague ? primaryLeague.league.id : 135;
      let leagueName = primaryLeague ? primaryLeague.league.name : "League";
      let seasonYear = primaryLeague ? primaryLeague.seasons[primaryLeague.seasons.length - 1].year : 2024;

      // 3. Στατιστικά
      let statsRes = await fetch(`https://v3.football.api-sports.io/teams/statistics?season=${seasonYear}&team=${team.id}&league=${leagueId}`, {
        headers: { "x-apisports-key": key }
      });
      let statsData = await statsRes.json();
      
      let side = isHome ? "home" : "away";
      let fixtures = statsData.response.fixtures.played[side] || 1;
      let goals = (statsData.response.goals.for.total[side] || 1) / fixtures;

      return {
        officialName: team.name,
        league: leagueName,
        shots: isHome ? (goals * 7.5) : (goals * 6.5),
        sot: isHome ? (goals * 3.2) : (goals * 2.4),
        corners: isHome ? 6.0 : 4.5
      };
    } catch (e) {
      console.error(e);
      return { error: "Σφάλμα επικοινωνίας με το API." };
    }
  }

  async function startProcess() {
    const hName = document.getElementById("homeTeam").value.trim();
    const aName = document.getElementById("awayTeam").value.trim();
    const runs = parseInt(document.getElementById("simRuns").value);
    const box = document.getElementById("statusBox");
    const results = document.getElementById("resultsPanel");

    box.className = "status-box status-success";
    box.style.display = "block";
    box.innerText = `⏳ Αναζήτηση στατιστικών για "${hName}" & "${aName}"...`;
    results.style.display = "none";

    let hStats = await fetchRealTeamStats(hName, true, API_KEY);
    let aStats = await fetchRealTeamStats(aName, false, API_KEY);

    // Έλεγχος για σφάλματα εύρεσης ομάδας
    let errors = [];
    if (!hStats || hStats.error) errors.push(hStats ? hStats.error : `Η ομάδα "${hName}" δεν βρέθηκε.`);
    if (!aStats || aStats.error) errors.push(aStats ? aStats.error : `Η ομάδα "${aName}" δεν βρέθηκε.`);

    if (errors.length > 0) {
      box.className = "status-box status-error";
      box.innerHTML = `⚠️ <strong>Σφάλμα Εντοπισμού:</strong><br>${errors.join("<br>")}<br><small>Παρακαλώ γράψε το όνομα της ομάδας στα Αγγλικά (π.χ. Inter, Juventus, Arsenal).</small>`;
      return;
    }

    // Επιτυχής εύρεση πραγματικών δεδομένων
    box.className = "status-box status-success";
    box.innerHTML = `✅ <strong>Πραγματικά δεδομένα API:</strong><br>
      • Γηπεδούχος: <strong>${hStats.officialName}</strong> (${hStats.league})<br>
      • Φιλοξενούμενη: <strong>${aStats.officialName}</strong> (${aStats.league})<br>
      🚀 Εκτελέστηκαν ${runs.toLocaleString()} προσομοιώσεις Monte Carlo!`;

    setTimeout(() => {
      runSimulation(hStats, aStats, runs);
    }, 100);
  }

  function runSimulation(hStats, aStats, runs) {
    let totShotsSim = new Uint8Array(runs);
    let totSotSim = new Uint8Array(runs);
    let sumShots = 0, sumSot = 0;

    for (let i = 0; i < runs; i++) {
      let hs = getPoisson(hStats.shots);
      let as = getPoisson(aStats.shots);
      let totS = hs + as;
      totShotsSim[i] = totS;
      sumShots += totS;

      let hsot = getPoisson(hStats.sot);
      let asot = getPoisson(aStats.sot);
      let totSo = hsot + asot;
      totSotSim[i] = totSo;
      sumSot += totSo;
    }

    document.getElementById("totalShotsAvg").innerText = (sumShots / runs).toFixed(1);
    document.getElementById("totalSotAvg").innerText = (sumSot / runs).toFixed(1);
    document.getElementById("totalCornersAvg").innerText = (hStats.corners + aStats.corners).toFixed(1);

    const lines = [
      { name: "Over 28.5 Σουτ", arr: totShotsSim, threshold: 28.5, book: 1.72 },
      { name: "Under 28.5 Σουτ", arr: totShotsSim, threshold: 28.5, book: 2.05, isUnder: true },
      { name: "Over 30.5 Σουτ", arr: totShotsSim, threshold: 30.5, book: 2.27 },
      { name: "Under 30.5 Σουτ", arr: totShotsSim, threshold: 30.5, book: 1.60, isUnder: true },
      { name: "Over 10.5 SoT", arr: totSotSim, threshold: 10.5, book: 2.02 },
      { name: "Under 10.5 SoT", arr: totSotSim, threshold: 10.5, book: 1.75, isUnder: true }
    ];

    let tableHtml = "";
    lines.forEach(m => {
      let count = 0;
      for (let i = 0; i < runs; i++) {
        if (m.isUnder ? m.arr[i] < m.threshold : m.arr[i] > m.threshold) count++;
      }
      let prob = (count / runs) * 100;
      let fair = (100 / prob).toFixed(2);
      let ev = ((prob / 100) * m.book - 1) * 100;
      let valTag = ev > 0 ? `<span class="badge-value">★ VALUE +${ev.toFixed(1)}%</span>` : "-";

      tableHtml += `<tr>
        <td><strong>${m.name}</strong></td>
        <td>${prob.toFixed(1)}%</td>
        <td>${fair}</td>
        <td>${m.book.toFixed(2)}</td>
        <td>${valTag}</td>
      </tr>`;
    });

    document.getElementById("marketTable").innerHTML = tableHtml;
    document.getElementById("resultsPanel").style.display = "block";

    let bins = {};
    for (let i = 15; i <= 45; i++) bins[i] = 0;
    for (let i = 0; i < runs; i++) {
      let val = totShotsSim[i];
      if (val >= 15 && val <= 45) bins[val]++;
    }

    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('shotsChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: Object.keys(bins),
        datasets: [{
          label: 'Συχνότητα Εμφάνισης Σουτ (Monte Carlo)',
          data: Object.values(bins).map(v => (v / runs * 100).toFixed(2)),
          backgroundColor: '#0284c7'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#94a3b8' } } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
        }
      }
    });
  }
</script>

</body>
</html>
