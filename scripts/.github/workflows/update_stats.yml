name: Update Football Stats

on:
  schedule:
    # Τρέχει αυτόματα κάθε Δευτέρα στις 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch: # Επιτρέπει να το τρέχεις χειροκίνητα με ένα κλικ όποτε θες

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stats Update Script
        run: python scripts/update_stats.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add teams_stats.json
          if git diff --staged --quiet; then
            echo "No changes in team statistics."
          else
            git commit -m "Auto-update team stats [skip ci]"
            git push
          fi
